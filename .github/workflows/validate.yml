name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Structural gate: manifests agree, every skill is actually discoverable,
      # frontmatter is present, bundled ${CLAUDE_PLUGIN_ROOT} paths resolve.
      # Pure stdlib, no vendor CLI — this is the check that must always run.
      - name: Validate library structure
        run: python3 scripts/validate_library.py

      # Every bundled script must at least import cleanly. compileall exits 0 on
      # a path that does not exist, so assert the directories first — otherwise a
      # layout change silently turns this step into a no-op.
      - name: Byte-compile bundled scripts
        run: |
          test -d plugins && test -d templates
          python3 -m compileall -q plugins templates scripts

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Vendor validator, in addition to ours. Allowed to fail on install or
      # upstream schema drift — it must not gate a PR on npm being reachable.
      - name: Validate manifests with the Claude CLI
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code
          # The repo is the plugin, so this validates both manifests at once.
          claude plugin validate .
